[package]
name = "tangible-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
futures-util = { version = "0.3.31", default-features = false }
getrandom = "0.4.3"
hex = "0.4.3"
# Seals integration secrets (ADR 0016): ChaCha20-Poly1305, already in the
# tree through rustls.
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tangible-burn = { version = "0.2.1", path = "../burn" }
tangible-db = { version = "0.2.1", path = "../db" }
tangible-domain = { version = "0.2.1", path = "../domain" }
tangible-image = { version = "0.2.1", path = "../image" }
tangible-integrations = { version = "0.2.1", path = "../integrations" }
tangible-storage = { version = "0.2.1", path = "../storage" }
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util", "sync"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace", "cors", "limit", "fs"] }
tracing = "0.1.44"
utoipa = { version = "5.5.0", features = ["axum_extras", "time", "uuid"] }
utoipa-axum = "0.2.0"
uuid = { version = "1.24.0", features = ["v7"] }

[lints]
workspace = true

[dev-dependencies]
# A fake identity provider's signing key and ID tokens, for the OIDC route
# tests: the aws-lc that verification uses.
aws-lc-rs = "1.18.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
async-trait = "0.1.91"
# Makes the buckets and objects the S3 import tests read, signed the same
# way the integrations crate signs.
rusty-s3 = { version = "0.10.2", default-features = false, features = ["rustcrypto"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "time"] }
tempfile = "3.27.0"
