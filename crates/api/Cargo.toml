[package]
name = "tangible-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tangible-burn = { version = "0.1.0", path = "../burn" }
tangible-db = { version = "0.1.0", path = "../db" }
tangible-domain = { version = "0.1.0", path = "../domain" }
tangible-image = { version = "0.1.0", path = "../image" }
tangible-integrations = { version = "0.1.0", path = "../integrations" }
tangible-storage = { version = "0.1.0", path = "../storage" }
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util"] }
tower-http = { version = "0.7.0", features = ["trace", "cors", "limit"] }
tracing = "0.1.44"
utoipa = { version = "5.5.0", features = ["axum_extras", "time", "uuid"] }
utoipa-axum = "0.2.0"

[lints]
workspace = true

[dev-dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "time"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.24.0", features = ["v7"] }
