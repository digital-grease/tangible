[package]
name = "tangible-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
hex = "0.4.3"
serde_json = "1.0.151"
sha2 = "0.11.0"
tangible-domain = { version = "0.1.0", path = "../domain" }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v7"] }

[lints]
workspace = true

[dev-dependencies]
sha2 = "0.11.0"
tempfile = "3.27.0"
time = "0.3.55"
