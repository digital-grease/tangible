[package]
name = "tangible-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
crc = "3.4.0"
hex = "0.4.3"
md-5 = "0.10.6"
# Free space for diagnostics: a safe statvfs, so the workspace can keep
# forbidding unsafe code.
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs"] }
serde_json = "1.0.151"
sha1 = "0.10.7"
sha2 = "0.11.0"
tangible-domain = { version = "0.2.1", path = "../domain" }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v7"] }

[lints]
workspace = true

[dev-dependencies]
sha2 = "0.11.0"
tempfile = "3.27.0"
time = "0.3.55"
