[package]
name = "tangible-burn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1.91"
hex = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tangible-domain = { version = "0.1.0", path = "../domain" }
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["process", "time", "rt", "io-util", "fs", "rt-multi-thread", "macros"] }
tracing = "0.1.44"

# The device lock opens a drive with O_NONBLOCK, because an optical drive with
# an empty tray refuses an ordinary open. One constant, on the only platform
# that has optical drives passed into containers.
[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[lints]
workspace = true

[dev-dependencies]
sha2 = "0.11.0"
tempfile = "3.27.0"
