[package]
name = "tangible-integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# An NZB goes to NZBGet base64 in its JSON-RPC append. The same version the
# API crate uses.
base64 = "0.23.1"
hex = "0.4.3"
# The random state, nonce and PKCE verifier of an OIDC sign-in; the same
# version the API crate uses.
getrandom = "0.4.3"
# Verifies OpenID Connect ID tokens (ADR 0018, docs/plans/oidc.md): their
# signatures, on aws-lc, which rustls already brings, and registered claims.
# Not the rust_crypto backend, which brings `rsa` and RUSTSEC-2023-0071.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
# The outbound client (ADR 0016): the same reqwest the worker already uses,
# with rustls, and its own resolver.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
# Signs S3 requests (SigV4) for an S3-compatible import (ADR 0016, owner's
# choice 2026-10-24); the requests themselves go through the outbound client.
# Only the signing: no XML or serde features.
rusty-s3 = { version = "0.11.0", default-features = false, features = ["rustcrypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# A torrent's v1 infohash, which is SHA-1 by definition (BEP 3). Already in
# the tree through sqlx.
sha1 = "0.10.7"
sha2 = "0.11.0"
tangible-domain = { version = "0.1.0", path = "../domain" }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["net", "fs", "io-util"] }
tracing = "0.1.44"
url = "2.5.7"

[lints]
workspace = true

[dev-dependencies]
# Signing keys for the fake identity provider in the OIDC tests: the same
# aws-lc that jsonwebtoken verifies with.
aws-lc-rs = "1.18.0"
# The CUE rewriter the server passes to the planner, so the tests plan with
# the real one. A test dependency only: the planner itself does not depend
# on the image crate.
tangible-image = { version = "0.1.0", path = "../image" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["net", "macros", "rt-multi-thread", "io-util"] }
