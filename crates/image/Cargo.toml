[package]
name = "tangible-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1.91"
# A 7z start header's checksum, checked as the 7z reader checks it, so the
# header checked first is the one it reads; the same crate it uses.
crc32fast = "1.5.4"
hex = "0.4.3"
# Reads Logiqx XML DATs (docs/plans/dat-matching.md H2). No features: no
# serde, no encodings but UTF-8, and it expands no entity but XML's own.
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
# Archive imports (docs/plans/archives.md): ZIP, 7z and tar, the owner's
# choice of 2026-11-02, read in pure Rust with no C library. Only what
# unpacking needs: ZIP's stored and deflate entries, 7z without its AES or
# bzip2, tar without extended attributes, gzip and xz for compressed tars.
# No RAR: its decoder is not free software.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz"] }
sevenz-rust2 = { version = "0.24.2", default-features = false }
tar = { version = "0.4.46", default-features = false }
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }
# A DVD CHD's ISO is checked against the CHD's data SHA-1
# (docs/plans/chd-images.md); already in the tree for preservation hashes.
sha1 = "0.10.7"
sha2 = "0.11.0"
tangible-domain = { version = "0.2.1", path = "../domain" }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "process", "time", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
