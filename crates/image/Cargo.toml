[package]
name = "tangible-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1.91"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tangible-domain = { version = "0.1.0", path = "../domain" }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "process", "time", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
