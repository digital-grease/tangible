[package]
name = "tangible-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tangible"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tangible-api = { version = "0.2.1", path = "../api" }
tangible-burn = { version = "0.2.1", path = "../burn" }
tangible-db = { version = "0.2.1", path = "../db" }
tangible-domain = { version = "0.2.1", path = "../domain" }
tangible-image = { version = "0.2.1", path = "../image" }
tangible-integrations = { version = "0.2.1", path = "../integrations" }
url = "2.5.7"
tangible-storage = { version = "0.2.1", path = "../storage" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v7"] }

[dev-dependencies]
time = "0.3.55"

[lints]
workspace = true
