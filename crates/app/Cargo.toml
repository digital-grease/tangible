[package]
name = "tangible-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tangible"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tangible-api = { version = "0.1.0", path = "../api" }
tangible-db = { version = "0.1.0", path = "../db" }
tangible-domain = { version = "0.1.0", path = "../domain" }
tangible-storage = { version = "0.1.0", path = "../storage" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[lints]
workspace = true
