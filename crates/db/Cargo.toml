[package]
name = "tangible-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "time", "macros", "migrate"] }
tangible-domain = { version = "0.1.0", path = "../domain" }
thiserror = "2.0.19"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
tracing = "0.1.44"
uuid = "1.24.0"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.151"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1.24.0", features = ["v7"] }
