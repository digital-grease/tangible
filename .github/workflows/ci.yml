#
# CI runs the same recipes a developer runs locally, so a green `just check`
# means the same thing in both places.
#
# Hardware tests are deliberately absent. They require a real optical drive
# and are gated behind TANGIBLE_HARDWARE_TESTS.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # The fuzz targets need nightly to fuzz, but every saved input (seeds and
      # past crashes) replays on stable, so a fixed crash cannot come back.
      - name: Saved fuzz inputs
        run: |
          cargo clippy --manifest-path fuzz/Cargo.toml --lib --tests -- -D warnings
          cargo test --manifest-path fuzz/Cargo.toml --test replay

  engines:
    # The engine tests run the real xorriso and cdrdao, against a file target
    # and a table of contents respectively. No drive is involved; that is what
    # TANGIBLE_HARDWARE_TESTS is for.
    name: Burn engines against the real tools
    runs-on: ubuntu-latest
    env:
      TANGIBLE_XORRISO_TESTS: "1"
      TANGIBLE_CDRDAO_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Install xorriso and cdrdao
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xorriso cdrdao

      - name: xorriso engine
        run: cargo test -p tangible-burn --all-features --test xorriso_engine

      - name: cdrdao engine
        run: cargo test -p tangible-burn --all-features --test cdrdao_engine

  openapi:
    name: OpenAPI and generated client are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          # The version comes from web/package.json's packageManager field.
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: The document matches the code
        run: |
          cargo run --quiet -p tangible-app -- openapi > /tmp/openapi.json
          if ! diff -u openapi.json /tmp/openapi.json; then
            echo "::error::openapi.json is out of date. Run: just openapi"
            exit 1
          fi

      - name: The generated client matches the document
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web gen:api
          if ! git diff --quiet -- web/src/lib/api-types.ts; then
            git diff -- web/src/lib/api-types.ts
            echo "::error::web/src/lib/api-types.ts is out of date. Run: just openapi"
            exit 1
          fi

  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tangible
          POSTGRES_PASSWORD: tangible
          POSTGRES_DB: tangible
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tangible"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TANGIBLE_DATABASE_URL: postgres://tangible:tangible@localhost:5432/tangible
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Migrations apply to an empty database
        run: cargo run --quiet -p tangible-app -- migrate

      - name: Migrations are idempotent
        run: cargo run --quiet -p tangible-app -- migrate

      - name: Dependencies are reachable
        run: cargo run --quiet -p tangible-app -- doctor

      - name: Integration tests
        run: cargo test --workspace --all-features -- --ignored

  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every Compose combination renders
        run: |
          docker compose -f deploy/compose.yaml \
            --env-file deploy/.env.example config >/dev/null
          docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml \
            --env-file deploy/.env.example config >/dev/null
          TANGIBLE_WORKER_NAME=validate TANGIBLE_OPTICAL_GID=990 docker compose \
            -f deploy/compose.yaml -f deploy/compose.hardware.yaml \
            --env-file deploy/.env.example config >/dev/null
          TANGIBLE_WORKER_NAME=validate TANGIBLE_OPTICAL_GID=990 \
          TANGIBLE_SCSI_DEVICE=/dev/sg4 docker compose \
            -f deploy/compose.yaml -f deploy/compose.hardware.yaml \
            -f deploy/compose.hardware-sg.yaml \
            --env-file deploy/.env.example config >/dev/null

      # Every service drops all capabilities (PostgreSQL keeps the five its
      # entrypoint needs), sets no-new-privileges, a read-only root and a
      # process limit; only a burn worker maps a device, and only a drive.
      - name: Every container is confined
        run: |
          render() { docker compose "$@" --env-file deploy/.env.example config --format json; }
          render -f deploy/compose.yaml | deploy/check-hardening.sh
          render -f deploy/compose.yaml -f deploy/compose.dev.yaml \
            | deploy/check-hardening.sh --allow-writable server
          export TANGIBLE_WORKER_NAME=validate TANGIBLE_OPTICAL_GID=990
          render -f deploy/compose.yaml -f deploy/compose.hardware.yaml \
            | deploy/check-hardening.sh
          TANGIBLE_SCSI_DEVICE=/dev/sg4 render -f deploy/compose.yaml \
            -f deploy/compose.hardware.yaml -f deploy/compose.hardware-sg.yaml \
            | deploy/check-hardening.sh

      - name: No default stack can reach an optical drive
        run: |
          check() {
            if docker compose "$@" --env-file deploy/.env.example config \
                 | grep -qE "devices:|privileged: true"; then
              echo "::error::device or privileged access in a default stack: $*"
              exit 1
            fi
          }
          check -f deploy/compose.yaml
          check -f deploy/compose.yaml -f deploy/compose.dev.yaml

      - name: No image uses a floating tag
        run: |
          if docker compose -f deploy/compose.yaml \
               --env-file deploy/.env.example config \
               | grep -E "image:.*:latest"; then
            echo "::error::production examples must pin a tag or digest"
            exit 1
          fi

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Licences, advisories, bans, sources
        run: cargo deny check

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The version comes from web/package.json's packageManager field.
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
