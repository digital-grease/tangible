#
# Code scanning with CodeQL. GitHub's default setup ran it until 0.4.0, and
# this runs it the same way: the same languages, the default query suite,
# on every push to main and pull request, and once a week. What default
# setup could not do is take .github/codeql/codeql-config.yml, which leaves
# the tests out. Default setup must stay off (Settings, Code security), or
# GitHub refuses this workflow's results.
#
# Each analysis keeps default setup's category, /language:<language>, so
# the alerts it raised, and those dismissed, carry on as the same alerts.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, after Renovate's weekly run.
    - cron: "17 13 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust is analysed from its source, without building; the others
        # need no build.
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
