# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Build, sign and stage a release from a version tag.
#
# Pushing a tag vX.Y.Z (matching the workspace version) builds the image,
# pushes it to GHCR by that tag, and produces:
#
#   - an SBOM and a SLSA provenance attestation inside the registry (BuildKit)
#   - a keyless Sigstore signature on the image digest (cosign), bound to this
#     workflow at this tag
#   - a GitHub artifact attestation for the image and for every release file
#   - tangible-vX.Y.Z-source.tar.gz and tangible-deploy-vX.Y.Z.tar.gz
#   - SOURCES.md, where the Corresponding Source of everything in the image is
#   - sbom.spdx.json, the image's SBOM as a file
#   - THIRD_PARTY_NOTICES-rust.txt and THIRD_PARTY_NOTICES-web.txt, the
#     licence notices of the crates and JavaScript in the image, taken from it
#   - SHA256SUMS, signed (SHA256SUMS.sigstore.json)
#
# The image is scanned with Grype before it is signed; a high or critical
# vulnerability with a fix available stops the release there.
#
# The GitHub release is created as a DRAFT. A person reads it, checks it
# against the release checklist, and publishes it; nothing here does.
#
# Every action is pinned to a commit, not a tag: this job can mint signing
# identities and push images, so what it runs must not change under it.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and stage
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release
      packages: write # GHCR
      id-token: write # keyless signing and attestations
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags too, for the patch release check below.
          fetch-depth: 0

      - name: The tag is the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version"
            exit 1
          fi

      # A patch release reaches installs on its own: the Compose files name
      # the minor tag, which publishing it moves (minor-tag.yml), and their
      # `migrate` applies what it brings. So it changes no migration, and adds
      # one only when the release before it runs on the migrated database,
      # which the migration says in a line opening `-- Additive:`
      # (docs/RELEASE_CHECKLIST.md). A minor release may do either.
      - name: A patch release migrates only what the release before runs on
        run: |
          patch=${TAG##*.}
          if [ "$patch" = 0 ]; then
            echo "$TAG is a minor release"
            exit 0
          fi
          base="${TAG%.*}.0"
          git rev-parse --verify --quiet "refs/tags/$base" >/dev/null || {
            echo "::error::$TAG is a patch release, and $base is not tagged"
            exit 1
          }
          changed=$(git diff --name-only --diff-filter=MDRT "$base" "$TAG" -- migrations/)
          if [ -n "$changed" ]; then
            echo "::error::$TAG changes migrations $base already had: $changed"
            exit 1
          fi
          for file in $(git diff --name-only --diff-filter=A "$base" "$TAG" -- migrations/); do
            if ! grep -q '^-- Additive:' "$file"; then
              echo "::error file=$file::new in a patch release, and does not say why the release before runs on it (-- Additive:)"
              exit 1
            fi
            echo "$file: additive"
          done

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit time
        id: created
        # The commit's time, not the build's, so the label is reproducible.
        run: echo "at=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ env.TAG }}
          build-args: |
            VERSION=${{ env.TAG }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.created.outputs.at }}
          sbom: true
          provenance: mode=max

      # Before anything is signed: the published image never carries
      # decryption code; operators who want it build
      # deploy/decryption/Dockerfile themselves.
      - name: No decryption code in the image
        env:
          REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull --quiet "$REF"
          deploy/check-no-decryption.sh "$REF"

      # Before anything is signed: an image with a known high or critical
      # vulnerability that already has a fix is rebuilt on newer bases, not
      # released. Unfixed ones are reported but do not block, since nothing
      # but waiting for the distribution would clear them.
      - name: Scan the image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          severity-cutoff: high
          only-fixed: true
          output-format: table
          output-file: grype.txt

      - name: Scan report
        if: ${{ !cancelled() && hashFiles('grype.txt') != '' }}
        run: |
          {
            echo '### Vulnerabilities with a fix available'
            echo '```'
            cat grype.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # Named, so a new cosign cannot change the signature format under a
          # release; cosign 3 writes Sigstore bundles, which verifying needs
          # cosign 3 or later to find (deploy/README.md says so).
          cosign-release: v3.1.4

      - name: Sign the image
        env:
          REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Release files
        env:
          REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="tangible-$TAG/" \
            -o "dist/tangible-$TAG-source.tar.gz" "$TAG"
          git archive --format=tar.gz --prefix="tangible-deploy-$TAG/" \
            -o "dist/tangible-deploy-$TAG.tar.gz" "$TAG:deploy"
          docker pull --quiet "$REF"
          deploy/sources.sh "$REF" "$TAG" > dist/SOURCES.md
          docker buildx imagetools inspect "$REF" --format '{{ json .SBOM.SPDX }}' \
            > dist/sbom.spdx.json
          jq -e '.spdxVersion' dist/sbom.spdx.json > /dev/null
          container=$(docker create "$REF")
          for part in rust web; do
            docker cp "$container:/usr/share/doc/tangible/THIRD_PARTY_NOTICES-$part.txt" dist/
            test -s "dist/THIRD_PARTY_NOTICES-$part.txt"
          done
          docker rm "$container" > /dev/null
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Sign the checksums
        run: |
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS

      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tangible-*.tar.gz
            dist/SOURCES.md
            dist/sbom.spdx.json
            dist/THIRD_PARTY_NOTICES-*.txt

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > notes.md <<EOF
          Image: \`$IMAGE:$TAG\`

          Digest: \`$IMAGE@$DIGEST\`

          Pin the digest in your Compose file, and verify it before use, with
          cosign 3.0 or later; see "Verifying a release" in deploy/README.md.

          \`\`\`bash
          cosign verify "$IMAGE@$DIGEST" \\
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          gh release create "$TAG" --draft --verify-tag \
            --title "Tangible $TAG" --notes-file notes.md dist/*
