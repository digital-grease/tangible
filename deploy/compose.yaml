#
# Base Compose topology: server plus database.
#
# This file deliberately contains NO optical-device mapping. Burn workers live
# in compose.hardware.yaml and are opted into explicitly, so that neither the
# default stack nor the development stack can reach a drive by accident.
#
# Review this file, the env file, volume mappings, ports, and image references
# before starting the stack. Pin an image digest for production.

name: tangible

services:
  server:
    image: ghcr.io/digital-grease/tangible:v0.2.0
    command: ["serve"]
    restart: unless-stopped
    # Asked to stop, the server gives requests under way 30 seconds, then
    # lets background work under way finish. Docker's own default is 10
    # seconds; past this, what is still running is killed, as in a crash,
    # and taken up again the way a crash's would be.
    stop_grace_period: 1m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TANGIBLE_DATABASE_URL: postgres://tangible:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/tangible
      TANGIBLE_BIND: 0.0.0.0:8080
      TANGIBLE_PUBLIC_URL: ${TANGIBLE_PUBLIC_URL:-http://localhost:8080}
      TANGIBLE_STORAGE_KIND: filesystem
      TANGIBLE_STORAGE_ROOT: /var/lib/tangible/library
      TANGIBLE_STAGING_ROOT: /var/lib/tangible/staging
      TANGIBLE_LOG: ${TANGIBLE_LOG:-tangible=info,tower_http=info}
      # Directories imports may be taken from, as id=path,id=path. Empty by
      # default: with none configured, no request can name a path on this host
      # at all. Anything listed here must also be mounted below.
      TANGIBLE_WATCH_ROOTS: ${TANGIBLE_WATCH_ROOTS:-}
      # Watched roots Tangible may delete imported Usenet downloads in, for a
      # SABnzbd or NZBGet set to remove after import (deploy/README.md,
      # "Deleting Usenet downloads once imported"). Empty: every root is only
      # read. Mount each one listed read-write, the rest :ro.
      TANGIBLE_REMOVABLE_ROOTS: ${TANGIBLE_REMOVABLE_ROOTS:-}
      TANGIBLE_MAX_UPLOAD_BYTES: ${TANGIBLE_MAX_UPLOAD_BYTES:-68719476736}
      # What makes derivatives (CHDs of disc images), each one only when asked
      # for: chdman, which the image carries, or none.
      TANGIBLE_DERIVATION_ENGINE: ${TANGIBLE_DERIVATION_ENGINE:-chdman}
      # Where operators' issue reports open. The server never sends one; it
      # prepares scrubbed text the operator reads and opens from their own
      # browser. Set it empty in .env to stop offering reports (no colon in
      # the default below, so empty stays empty).
      TANGIBLE_REPORT_ISSUES_URL: ${TANGIBLE_REPORT_ISSUES_URL-https://github.com/digital-grease/tangible/issues/new}
      TANGIBLE_REPORT_SCRUB_ADDRESSES: ${TANGIBLE_REPORT_SCRUB_ADDRESSES:-true}
      # Whether operators may ask a rip to decrypt an encrypted disc, on a
      # worker run from an image built to (deploy/README.md, "Ripping
      # encrypted discs"). Off unless set to true.
      TANGIBLE_ALLOW_DECRYPTION: ${TANGIBLE_ALLOW_DECRYPTION:-false}
      # Whether operators may import a file from a URL the server fetches
      # (deploy/README.md, "Importing from a URL"). Off unless set to true.
      # Public addresses over https only, unless the next three say more.
      TANGIBLE_URL_IMPORTS: ${TANGIBLE_URL_IMPORTS:-false}
      TANGIBLE_URL_IMPORTS_ALLOW_HTTP: ${TANGIBLE_URL_IMPORTS_ALLOW_HTTP:-false}
      TANGIBLE_OUTBOUND_ALLOW: ${TANGIBLE_OUTBOUND_ALLOW:-}
      TANGIBLE_OUTBOUND_PROXY: ${TANGIBLE_OUTBOUND_PROXY:-}
      # Days after a full integrity scrub ends before the next is queued
      # (deploy/README.md, "Checking stored bytes"). Off (0) unless set.
      TANGIBLE_SCRUB_INTERVAL_DAYS: ${TANGIBLE_SCRUB_INTERVAL_DAYS:-0}
      # CRC32, MD5 and SHA-1 of every artifact's files and CD tracks, for
      # matching against DATs (deploy/README.md, "Identifying discs with
      # DATs"). On unless set to false.
      TANGIBLE_PRESERVATION_HASHES: ${TANGIBLE_PRESERVATION_HASHES:-true}
      # RomM's roms directory, to show chosen games in RomM (deploy/README.md,
      # "Showing games in RomM"). Off unless set: uncomment this and the
      # matching volume below. Tangible writes only folders it marks as its
      # own there.
      # TANGIBLE_ROMM_EXPORT_ROOT: /var/lib/tangible/romm
      # The key download-client passwords are sealed with (deploy/README.md,
      # "Integration secrets"). Off unless set: uncomment this and the two
      # secrets blocks below once the key file exists.
      # TANGIBLE_SECRET_KEY_FILE: /run/secrets/tangible-secret-key
      # Prometheus metrics, on a listener of their own (deploy/README.md,
      # "Metrics"). Off unless set: uncomment the first line. A Prometheus on
      # this Compose network scrapes server:9464 without the port being
      # published; publish it (below) only with the token set too.
      # TANGIBLE_METRICS_BIND: 0.0.0.0:9464
      # TANGIBLE_METRICS_TOKEN_FILE: /run/secrets/tangible-metrics-token
      # Signing in through an OpenID Connect provider (deploy/README.md,
      # "Signing in through an identity provider"). Off unless the issuer is
      # set in .env; the client secret is a file: uncomment its line and the
      # tangible-oidc-client-secret secret lines below.
      TANGIBLE_OIDC_ISSUER: ${TANGIBLE_OIDC_ISSUER:-}
      TANGIBLE_OIDC_CLIENT_ID: ${TANGIBLE_OIDC_CLIENT_ID:-}
      # TANGIBLE_OIDC_CLIENT_SECRET_FILE: /run/secrets/tangible-oidc-client-secret
      TANGIBLE_OIDC_DISPLAY_NAME: ${TANGIBLE_OIDC_DISPLAY_NAME:-single sign-on}
      TANGIBLE_OIDC_SCOPES: ${TANGIBLE_OIDC_SCOPES:-openid profile email groups}
      TANGIBLE_OIDC_GROUPS_CLAIM: ${TANGIBLE_OIDC_GROUPS_CLAIM:-groups}
      TANGIBLE_OIDC_ADMIN_GROUPS: ${TANGIBLE_OIDC_ADMIN_GROUPS:-}
      TANGIBLE_OIDC_OPERATOR_GROUPS: ${TANGIBLE_OIDC_OPERATOR_GROUPS:-}
      TANGIBLE_OIDC_VIEWER_GROUPS: ${TANGIBLE_OIDC_VIEWER_GROUPS:-}
      TANGIBLE_PASSWORD_SIGN_IN: ${TANGIBLE_PASSWORD_SIGN_IN:-all}
      # No engine is configured here. The server does not write discs; the
      # burn workers do, and they select an engine themselves.
    # secrets:
    #   - tangible-secret-key
    #   - tangible-metrics-token
    #   - tangible-oidc-client-secret
    volumes:
      - library:/var/lib/tangible/library
      - staging:/var/lib/tangible/staging
      # - /path/to/romm/library/roms:/var/lib/tangible/romm
    ports:
      - "${TANGIBLE_HTTP_PORT:-8080}:8080"
      # - "127.0.0.1:9464:9464"
    healthcheck:
      # Readiness, not liveness: burn workers gate on service_healthy and must
      # not start until the server can actually reach its database.
      #
      # `doctor` exits non-zero when a dependency is unusable, and needs no
      # HTTP client in the image. It checks dependencies rather than the
      # listener, so pair it with the restart policy above, which covers a
      # process that is up but wedged.
      test: ["CMD", "tangible", "doctor"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Bounds a runaway or a fork bomb. Threads count: tokio's blocking pool
    # alone may grow to 512.
    pids_limit: 1024

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tangible
      POSTGRES_DB: tangible
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tangible"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    # The image's entrypoint starts as root to own the data directory, then
    # drops to the postgres user; these five are what that takes, and the
    # server process itself runs with none. Checked on a fresh volume and a
    # restart.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    # One process per connection; the server's pool holds ten.
    pids_limit: 256

volumes:
  library:
  staging:
  postgres-data:

# The integration secret key (deploy/README.md, "Integration secrets"). The
# file is yours to make and keep; it never goes in the repository or .env.
# secrets:
#   tangible-secret-key:
#     file: ./secrets/tangible-secret-key
#   tangible-metrics-token:
#     file: ./secrets/tangible-metrics-token
#   tangible-oidc-client-secret:
#     file: ./secrets/tangible-oidc-client-secret
