#
# OPT-IN HARDWARE OVERRIDE. Adds one burn worker bound to one optical drive.
#
# Render and read the result before starting it:
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.hardware.yaml config
#
# The block device is the only device node the worker gets. Both engines send
# their drive commands through it, and on the first real drive both burned and
# read back a disc with nothing else mapped. A drive that turns out to need the
# generic SCSI node as well can have it through compose.hardware-sg.yaml.
#
# One worker per drive. To add a second drive, copy the service, give it a new
# name, and map its own /dev/srN.

services:
  burner-sr0:
    image: ghcr.io/digital-grease/tangible:v0.1.0
    command: ["burn-worker"]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    devices:
      # Host path : in-container alias. The alias keeps the worker's
      # configuration identical across machines where the drive enumerates
      # differently.
      - "${TANGIBLE_BLOCK_DEVICE:-/dev/sr0}:/dev/disc-block:rwm"
    # A mapped device keeps its host owner and mode, typically root and a
    # group such as `optical` or `cdrom` with mode 0660, and the image runs as
    # an unprivileged user. Without that group the worker is refused its own
    # drive with "Permission denied". The number differs between
    # distributions, so there is no default to get wrong: find it with
    #   stat -c %g /dev/sr0
    group_add:
      - "${TANGIBLE_OPTICAL_GID:?set TANGIBLE_OPTICAL_GID to the group that owns the drive: stat -c %g /dev/sr0}"
    environment:
      TANGIBLE_SERVER_URL: http://server:8080
      TANGIBLE_BLOCK_DEVICE: /dev/disc-block
      TANGIBLE_WORKER_NAME: ${TANGIBLE_WORKER_NAME:?name this drive, e.g. pioneer-bdr-212}
      # Where the credential and the local recovery record live. It is on the
      # volume below because a worker that loses this cannot tell, after a
      # restart, whether an interrupted attempt wrote a disc.
      TANGIBLE_WORKER_STATE_DIR: /var/lib/tangible-worker
      # A one-use token, needed only on first start. Issue one from the
      # workers page, start the worker, then remove this line: the credential
      # it exchanges the token for lives on the volume.
      TANGIBLE_ENROLLMENT_TOKEN: ${TANGIBLE_ENROLLMENT_TOKEN:-}
      # `fake` writes to a file and touches no drive; `xorriso` writes ISO
      # images to the mapped device. The default stays fake, so a worker that
      # is merely started does not write to a disc somebody left in the tray.
      TANGIBLE_BURN_ENGINE: ${TANGIBLE_BURN_ENGINE:-fake}
      TANGIBLE_LOG: ${TANGIBLE_LOG:-tangible=info}
    volumes:
      # Local recovery state must survive a container restart.
      - burner-sr0-cache:/var/lib/tangible-worker
    security_opt:
      - no-new-privileges:true
    # privileged: true is never an accepted default.
    # The device mapping and the drive's group are the entire required
    # privilege.

volumes:
  burner-sr0-cache:
