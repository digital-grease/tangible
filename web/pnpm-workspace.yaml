#
# pnpm blocks dependency install scripts by default. This is the explicit,
# committed allowlist of the exceptions, so the decision is reviewable in the
# diff rather than living in an untracked local approval.
#
# Each entry is a dependency permitted to execute code at install time. Adding
# one is a supply-chain decision: that package's install script runs with the
# developer's and CI's privileges.
#
# esbuild: links its platform-specific binary during install. vite cannot run
# without it.
allowBuilds:
  esbuild: true

# Versions forced past what a dependency asks for, each to clear a security
# advisory the dependency has not yet taken up. Remove an entry once the
# dependency's own range moves past it.
#
# js-yaml: @redocly/openapi-core, which openapi-typescript uses to read the
# API description, pins exactly 4.3.1, affected by GHSA-2883-xcg3-v3hh; 4.3.2
# is the patch release that fixes it.
#
# minimatch 10: @typescript-eslint/typescript-estree (^10.2.2), and eslint
# 10.14 and @eslint/config-array 0.23.5 (^10.2.4), are affected by
# GHSA-g3hv-75wg-m249, which only 11.0.1 and later fix. They call minimatch()
# and the Minimatch class on lint patterns at lint time, and 11 keeps both and
# a CommonJS entry; lint is unchanged by it. eslint 10.15 and config-array
# 0.23.6 ask for ^11.0.5 themselves: once they are taken, only
# typescript-estree needs this.
overrides:
  js-yaml@4.3.1: 4.3.2
  minimatch@^10: ^11.0.8
